[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "image-extraction"
version = "0.1.0"
description = "Local image loading for video-to-image composition retrieval"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Pillow>=11,<13", "huggingface-hub>=1,<2", "numpy>=2,<3"]

[project.optional-dependencies]
# Adds the image encoder only; retain your existing CPU or GPU FAISS provider.
semantic = ["torch>=2.10,<3", "transformers>=5.5,<6"]
retrieval = ["faiss-cpu>=1.12,<2", "scenedetect>=0.7.1,<0.8", "opencv-python>=4.11,<5", "filelock>=3,<5"]
# Install one FAISS provider only: retrieval (CPU) or gpu (CUDA).
gpu = ["faiss-gpu==1.15.1", "scenedetect>=0.7.1,<0.8", "opencv-python>=4.11,<5", "filelock>=3,<5"]
# For environments where FAISS is managed separately.
video = ["scenedetect>=0.7.1,<0.8", "opencv-python>=4.11,<5", "filelock>=3,<5"]

[project.scripts]
image-extraction = "image_extraction.__main__:main"

[tool.setuptools.packages.find]
include = ["image_extraction*"]
